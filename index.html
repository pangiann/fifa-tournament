<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champions Night — Tournament Tracker</title>
<style>
:root{
  --bg1:#04071f; --bg2:#0a1547;
  --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.10); --txt:#eef1ff; --muted:#93a0c9;
  --accent:#4f8cff; --accent2:#6ee7ff; --win:#38d996; --gold:#ffd166; --bad:#ff6b81;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 550px at 75% -10%, #1a2a6e 0%, transparent 60%),
    radial-gradient(800px 500px at -10% 30%, #12205c 0%, transparent 55%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  min-height:100vh;color:var(--txt);padding:26px 16px 90px;
}
.wrap{max-width:1150px;margin:0 auto}
h1{
  margin:0;font-size:30px;letter-spacing:4px;text-transform:uppercase;font-weight:800;
  background:linear-gradient(90deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;
}
.subtitle{color:var(--muted);margin:6px 0 22px;font-size:14px}
.stars{letter-spacing:6px;color:var(--accent2);font-size:12px;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;backdrop-filter:blur(4px)}
.card h2{margin:0 0 12px;font-size:15px;text-transform:uppercase;letter-spacing:2px;color:var(--accent2)}
.card + .card, .layout + .card, .topbar + .card{margin-top:18px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,470px);gap:18px;align-items:start;margin-bottom:18px}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.landing{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
input.txt,input.num{
  width:100%;height:42px;padding:0 12px;font-size:15px;color:var(--txt);
  background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:10px;outline:none;
}
input.num{width:110px;text-align:center;font-weight:700;font-size:16px}
input.txt:focus,input.num:focus{border-color:var(--accent)}
input.code{letter-spacing:4px;text-transform:uppercase;font-weight:700}
.match{display:flex;align-items:center;gap:6px;padding:6px 4px;border-bottom:1px dashed rgba(255,255,255,.07)}
.match:last-of-type{border-bottom:none}
.match .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.match .name.away{text-align:right}
.match .winner{color:var(--win);font-weight:700}
.match .me{text-decoration:underline;text-decoration-color:var(--accent2);text-underline-offset:3px}
.gnum{font-size:10px;color:var(--muted);width:34px;flex:none}
input.score{
  width:44px;height:32px;text-align:center;font-size:15px;font-weight:700;color:var(--txt);
  background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:8px;outline:none;flex:none;
}
input.score:focus{border-color:var(--accent)}
input.score:disabled{opacity:.35}
input.score::-webkit-outer-spin-button,input.score::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.score{-moz-appearance:textfield;appearance:textfield}
.dash{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06)}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
td.pname,th.pname{text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.pts{font-weight:800}
.qmark{
  display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;font-size:10px;font-weight:800;
  line-height:16px;vertical-align:middle;background:rgba(56,217,150,.18);border:1px solid rgba(56,217,150,.55);color:var(--win);
}
tr.top4 td{background:rgba(79,140,255,.10)}
tr.top4 td:first-child{border-left:3px solid var(--accent)}
tr:not(.top4) td:first-child{border-left:3px solid transparent}
.scrollbox{max-height:520px;overflow-y:auto}
.legend{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5}
.chip{display:inline-block;background:rgba(79,140,255,.15);border:1px solid rgba(79,140,255,.4);color:var(--accent2);
  border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600}
.chip.warn{background:rgba(255,209,102,.12);border-color:rgba(255,209,102,.4);color:var(--gold)}
.btn{
  background:linear-gradient(135deg,var(--accent),#3457d5);color:#fff;border:none;border-radius:999px;
  padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.4px;
}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.ghost:hover{color:var(--txt);border-color:var(--muted)}
.btn.small{padding:7px 14px;font-size:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.bigcode{
  font-size:34px;font-weight:800;letter-spacing:10px;text-align:center;padding:14px 6px;
  background:rgba(0,0,0,.3);border:1px dashed rgba(110,231,255,.4);border-radius:12px;color:var(--accent2);
  margin-bottom:12px;user-select:all;
}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;max-height:340px;overflow-y:auto}
.pill{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;min-width:0}
.pill .pname-inline{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.pill .gt{display:block;font-size:11px;color:var(--muted);width:100%}
.pill .kick{
  background:transparent;border:1px solid rgba(255,107,129,.4);color:var(--bad);border-radius:6px;
  width:24px;height:24px;font-size:12px;cursor:pointer;flex:none;line-height:1;
}
.pill .kick:hover{background:rgba(255,107,129,.15)}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filterbar input.txt{flex:1;min-width:140px;height:36px}
.toggle{cursor:pointer;user-select:none}
.toggle.on{background:rgba(56,217,150,.15);border-color:rgba(56,217,150,.5);color:var(--win)}
.ko-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:6px;align-items:start}
.ko-round h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
.ko-match{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px}
.ko-match .tag{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pens{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.12);display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.locked{color:var(--muted);font-size:14px;text-align:center;padding:22px 10px}
.champion{
  margin-top:16px;text-align:center;font-size:22px;font-weight:800;padding:18px;border-radius:14px;
  background:linear-gradient(135deg,rgba(255,209,102,.16),rgba(255,209,102,.05));
  border:1px solid rgba(255,209,102,.45);color:var(--gold);letter-spacing:1px;
}
.seed{font-size:10px;color:var(--muted);background:rgba(255,255,255,.08);border-radius:6px;padding:1px 6px;margin:0 4px}
.error{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.notice{
  background:rgba(255,107,129,.08);border:1px solid rgba(255,107,129,.35);border-radius:12px;
  padding:12px 14px;font-size:13px;line-height:1.5;margin-top:12px;
}
.notice .actions{margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="stars">✦ ✦ ✦ ✦ ✦</div>
  <h1>Champions Night</h1>
  <div class="subtitle" id="subtitle">Join with a code · league phase · knockouts · glory</div>
  <div id="app"></div>
</div>

<script>
"use strict";

/* ================= pure logic (shared shape with server state) ================= */

function parseScore(v){
  if(v==null) return null;
  v=String(v).trim();
  if(v==="") return null;
  var n=parseInt(v,10);
  if(isNaN(n)||n<0) return null;
  return Math.min(n,99);
}
function leagueCompleteT(t){
  return t.results.length>0 && t.results.every(function(r){ return r.h!=null&&r.a!=null; });
}
function clientValidateDraw(n,k){
  if(n<2) return "You need at least 2 players to draw.";
  if(!(k>=1)) return "Games per player must be at least 1.";
  if(k>n-1) return "With "+n+" players, each one can face at most "+(n-1)+" different opponents.";
  if((n*k)%2===1) return n+" players × "+k+" games each is an odd total — impossible exactly.";
  return null;
}
/* standings ranked by points per assigned game, so a one-game-short player
   is compared fairly. With no exempt player this orders identically to points. */
function standingsOf(t){
  var rows=t.players.map(function(p){
    return {id:p.id,name:p.name,assigned:t.k-(t.exempt===p.id?1:0),
            p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0,avg:0};
  });
  var byId={}; rows.forEach(function(r){ byId[r.id]=r; });
  function apply(map,f,m){
    map[f.h].gf+=m.h; map[f.h].gd+=m.h-m.a;
    map[f.a].gf+=m.a; map[f.a].gd+=m.a-m.h;
    if(m.h>m.a) map[f.h].pts+=3;
    else if(m.a>m.h) map[f.a].pts+=3;
    else {map[f.h].pts++;map[f.a].pts++;}
  }
  t.fixtures.forEach(function(f,i){
    var m=t.results[i];
    if(!m||m.h==null||m.a==null) return;
    var H=byId[f.h],A=byId[f.a];
    H.p++;A.p++; H.gf+=m.h;H.ga+=m.a; A.gf+=m.a;A.ga+=m.h;
    if(m.h>m.a){H.w++;H.pts+=3;A.l++;}
    else if(m.a>m.h){A.w++;A.pts+=3;H.l++;}
    else {H.d++;A.d++;H.pts++;A.pts++;}
  });
  rows.forEach(function(r){ r.gd=r.gf-r.ga; r.avg=r.assigned>0?r.pts/r.assigned:0; });
  rows.sort(function(a,b){ return b.avg-a.avg || b.gd-a.gd || b.gf-a.gf || a.id-b.id; });
  /* head-to-head mini-table inside tied groups */
  var out=[],i2=0;
  while(i2<rows.length){
    var j=i2+1;
    while(j<rows.length && rows[j].avg===rows[i2].avg && rows[j].gd===rows[i2].gd && rows[j].gf===rows[i2].gf) j++;
    var group=rows.slice(i2,j);
    if(group.length>1){
      var ids={}; group.forEach(function(r){ ids[r.id]={pts:0,gd:0,gf:0}; });
      t.fixtures.forEach(function(f,i){
        var m=t.results[i];
        if(!m||m.h==null||m.a==null) return;
        if(!(f.h in ids)||!(f.a in ids)) return;
        apply(ids,f,m);
      });
      group.sort(function(a,b){
        var A=ids[a.id],B=ids[b.id];
        return B.pts-A.pts || B.gd-A.gd || B.gf-A.gf || a.id-b.id;
      });
    }
    out=out.concat(group); i2=j;
  }
  return out;
}
/* Players guaranteed a knockout spot. X is safe when fewer than Q others
   could still reach X's points even if X loses every remaining game and
   they win all of theirs. Ties count as a threat, so this never marks a
   player who could still drop out. Compared as points per assigned game
   (cross-multiplied, integer-exact) so an exempt player is handled. */
function qualifiedIds(t,rows){
  var Q=t.koSize, out={};
  if(!Q) return out;
  if(leagueCompleteT(t)){ rows.slice(0,Q).forEach(function(r){ out[r.id]=true; }); return out; }
  var maxPts=rows.map(function(r){ return r.pts+3*Math.max(0,r.assigned-r.p); });
  rows.forEach(function(x,i){
    if(x.assigned<=0) return;
    var threats=0;
    rows.forEach(function(y,j){
      if(j===i||y.assigned<=0) return;
      /* maxAvg(y) >= minAvg(x)  <=>  maxPts(y)/assigned(y) >= pts(x)/assigned(x) */
      if(maxPts[j]*x.assigned >= x.pts*y.assigned) threats++;
    });
    if(threats<Q) out[x.id]=true;
  });
  return out;
}
function koWinnerSide(m){
  if(m.h==null||m.a==null) return null;
  if(m.h>m.a) return "h";
  if(m.a>m.h) return "a";
  if(m.ph!=null&&m.pa!=null&&m.ph!==m.pa) return m.ph>m.pa?"h":"a";
  return null;
}
/* standard bracket seeding order: 1 and 2 can only meet in the final */
function bracketOrder(S){
  var o=[1,2];
  while(o.length<S){
    var next=[],m=o.length*2+1;
    o.forEach(function(s){ next.push(s,m-s); });
    o=next;
  }
  return o;
}
function roundNames(S){
  return {16:["Round of 16","Quarter-finals","Semi-finals","Final"],
          8:["Quarter-finals","Semi-finals","Final"],
          4:["Semi-finals","Final"],
          2:["Final"]}[S];
}
function matchTag(S,r,mi){
  var short={16:["R16","QF","SF","F"],8:["QF","SF","F"],4:["SF","F"],2:["F"]}[S][r];
  return (S>>(r+1))>1 ? short+(mi+1) : short;
}
function koMatchWinner(m){
  if(m.home==null||m.away==null) return null;
  var s=koWinnerSide(m.scores);
  return s ? (s==="h"?m.home:m.away) : null;
}
/* resolves the whole bracket from standings + stored knockout scores */
function koRoundsOf(t){
  var S=t.koSize;
  var seeds=standingsOf(t).slice(0,S).map(function(r){ return r.id; });
  var order=bracketOrder(S);
  var names=roundNames(S);
  var rounds=[],prev=null;
  for(var r=0;r<names.length;r++){
    var count=S>>(r+1),matches=[];
    for(var mi=0;mi<count;mi++){
      var key="r"+r+"m"+mi;
      var sc=t.ko[key]||{h:null,a:null,ph:null,pa:null};
      var home,away,ph1=null,ph2=null;
      if(r===0){ home=seeds[order[2*mi]-1]; away=seeds[order[2*mi+1]-1]; }
      else{
        home=koMatchWinner(prev[2*mi]); away=koMatchWinner(prev[2*mi+1]);
        ph1="Winner "+prev[2*mi].tag; ph2="Winner "+prev[2*mi+1].tag;
      }
      matches.push({key:key,tag:matchTag(S,r,mi),home:home,away:away,ph1:ph1,ph2:ph2,scores:sc});
    }
    rounds.push({name:names[r],matches:matches});
    prev=matches;
  }
  return rounds;
}
function championOf(t){
  var rounds=koRoundsOf(t);
  return koMatchWinner(rounds[rounds.length-1].matches[0]);
}

/* ================= app state ================= */

var T=null;          // tournament public state (from server)
var PMAP={};         // player id -> player, rebuilt whenever T changes
var code=null;       // active code
var session=null;    // {token, playerId, name} for this device
var ws=null, wsTimer=null, wsPing=null, wsDown=false;
var drawError=null;  // last draw rejection, shown in lobby
var removedNotice=false; // this device's player was removed by the host
var filterText="", onlyMine=false;
var landingError={create:"",join:""};

function setT(t){
  T=t; PMAP={};
  t.players.forEach(function(p){ PMAP[p.id]=p; });
  /* our player vanished (removed by host, or the room was reset) */
  if(session&&!PMAP[session.playerId]){
    session=null; clearSession(code);
    try{ localStorage.setItem("mp-removed-"+code,"1"); }catch(e){}
    removedNotice=true;
  }
}
function pl(id){ return PMAP[id]; }
function wasRemoved(c){
  try{ return localStorage.getItem("mp-removed-"+c)==="1"; }catch(e){ return false; }
}
function loadSession(c){
  try{ var raw=localStorage.getItem("mp-sess-"+c); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function saveSession(c,s){
  try{ localStorage.setItem("mp-sess-"+c,JSON.stringify(s)); }catch(e){}
}
function clearSession(c){
  try{ localStorage.removeItem("mp-sess-"+c); }catch(e){}
}
async function api(path,body){
  try{
    var res=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body||{})});
    var data=null; try{ data=await res.json(); }catch(e){}
    return {ok:res.ok,status:res.status,data:data||{}};
  }catch(e){
    return {ok:false,status:0,data:{message:"Network error — are you online?"}};
  }
}

/* ================= websocket live sync ================= */

function connect(){
  if(ws){ try{ ws.onclose=null; ws.close(); }catch(e){} ws=null; }
  clearInterval(wsPing);
  var proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(proto+"://"+location.host+"/api/t/"+code+"/ws");
  ws.onopen=function(){
    if(wsDown){ wsDown=false; render(); }
    /* keepalive so idle connections aren't dropped */
    wsPing=setInterval(function(){ try{ ws.send("ping"); }catch(e){} },20000);
  };
  ws.onmessage=function(ev){
    if(ev.data==="pong") return;
    try{
      var msg=JSON.parse(ev.data);
      if(msg.type==="state"){ setT(msg.t); wsDown=false; render(); }
    }catch(e){}
  };
  ws.onclose=function(){
    wsDown=true; render();
    clearInterval(wsPing);
    clearTimeout(wsTimer);
    wsTimer=setTimeout(connect,2000);
  };
}

/* ================= DOM helpers ================= */

function $(sel){ return document.querySelector(sel); }
function el(tag,attrs){
  var n=document.createElement(tag);
  attrs=attrs||{};
  Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(k==="class") n.className=v;
    else if(k.indexOf("on")===0) n.addEventListener(k.slice(2),v);
    else if(v!==null&&v!==undefined) n.setAttribute(k,v);
  });
  for(var i=2;i<arguments.length;i++){
    var kid=arguments[i];
    if(kid==null) continue;
    if(Array.isArray(kid)) kid.forEach(function(x){ if(x!=null) n.append(x); });
    else n.append(kid);
  }
  return n;
}
function scoreInput(val,fkey,opts){
  var i=el("input",{class:"score",type:"number",min:"0",max:"99",inputmode:"numeric","data-fkey":fkey});
  i.value=(val==null?"":val);
  if(opts.disabled) i.disabled=true;
  if(opts.oninput) i.addEventListener("input",opts.oninput);
  return i;
}
/* full re-render keeps code simple; this preserves the focused input across it */
function render(){
  var active=document.activeElement;
  var fkey=active&&active.getAttribute?active.getAttribute("data-fkey"):null;
  var val=fkey?active.value:null;
  doRender();
  if(fkey){
    var again=document.querySelector('[data-fkey="'+fkey+'"]');
    if(again){ again.value=val; again.focus(); }
  }
}

/* ================= views ================= */

function doRender(){
  var app=$("#app"); app.innerHTML="";
  if(!code||!T){ renderLanding(app); return; }
  $("#subtitle").textContent=T.players.length+" players · "+T.k+" games each · top "+koSizeDisplay(T)+" advance";
  if(T.phase==="lobby") renderLobby(app);
  else renderTournament(app);
}
/* koSize is null until the draw; show the projected size before it */
function projectedKoSize(n){ if(n>60) return 16; if(n>=20) return 8; if(n>=4) return 4; return 2; }

function renderLanding(app){
  var name=el("input",{class:"txt",type:"text",maxlength:"20",placeholder:"Your name"});
  var gt=el("input",{class:"txt",type:"text",maxlength:"20",placeholder:"PSN / Xbox gamertag (optional)"});
  var k=el("input",{class:"num",type:"number",min:"1",step:"1"}); k.value=4;
  var cerr=el("div",{class:"error"},landingError.create);

  var jcode=el("input",{class:"txt code",type:"text",maxlength:"6",placeholder:"ABC123"});
  var jname=el("input",{class:"txt",type:"text",maxlength:"20",placeholder:"Your name"});
  var jgt=el("input",{class:"txt",type:"text",maxlength:"20",placeholder:"Gamertag (optional)"});
  var jerr=el("div",{class:"error"},landingError.join);
  landingError={create:"",join:""};

  var grid=el("div",{class:"landing"},
    el("div",{class:"card"},
      el("h2",{},"Create a tournament"),
      el("div",{class:"field"},el("label",{},"Your name"),name),
      el("div",{class:"field"},el("label",{},"Gamertag"),gt),
      el("div",{class:"field"},el("label",{},"Games per player (changeable until the draw)"),k),
      el("div",{class:"actions"},el("button",{class:"btn",onclick:async function(){
        var r=await api("/api/create",{name:name.value,gamertag:gt.value,k:parseInt(k.value,10)});
        if(!r.ok){ cerr.textContent=r.data.message||"Could not create."; return; }
        saveSession(r.data.code,{token:r.data.token,playerId:r.data.playerId,name:name.value.trim()});
        location.hash="#/t/"+r.data.code;
      }},"Create & get a code")),
      cerr),
    el("div",{class:"card"},
      el("h2",{},"Join with a code"),
      el("div",{class:"field"},el("label",{},"Tournament code"),jcode),
      el("div",{class:"field"},el("label",{},"Your name"),jname),
      el("div",{class:"field"},el("label",{},"Gamertag"),jgt),
      el("div",{class:"actions"},
        el("button",{class:"btn",onclick:async function(){
          var c=jcode.value.trim().toUpperCase();
          if(!/^[A-Z0-9]{6}$/.test(c)){ jerr.textContent="Codes are 6 letters/digits."; return; }
          /* this browser already has a player in that tournament: go back in as them */
          if(loadSession(c)){ location.hash="#/t/"+c; return; }
          if(wasRemoved(c)){ jerr.textContent="You were removed from this tournament by the host."; return; }
          var r=await api("/api/t/"+c+"/join",{name:jname.value,gamertag:jgt.value});
          if(!r.ok){ jerr.textContent=r.data.message||"Could not join."; return; }
          saveSession(c,{token:r.data.token,playerId:r.data.playerId,name:jname.value.trim()});
          location.hash="#/t/"+c;
        }},"Join as player"),
        el("button",{class:"btn ghost",onclick:function(){
          var c=jcode.value.trim().toUpperCase();
          if(!/^[A-Z0-9]{6}$/.test(c)){ jerr.textContent="Codes are 6 letters/digits."; return; }
          location.hash="#/t/"+c;
        }},"Watch only")),
      jerr)
  );
  app.append(grid);
  $("#subtitle").textContent="Join with a code · league phase · knockouts · glory";
}

function topbar(){
  var bar=el("div",{class:"topbar"});
  bar.append(el("span",{class:"chip"},"Code: "+code));
  if(session) bar.append(el("span",{class:"chip"},"Playing as "+session.name));
  else bar.append(el("span",{class:"chip"},"👀 Spectating"));
  if(wsDown) bar.append(el("span",{class:"chip warn"},"reconnecting…"));
  bar.append(el("button",{class:"btn ghost small",onclick:function(){
    var link=location.origin+"/#/t/"+code;
    if(navigator.clipboard) navigator.clipboard.writeText(link);
  }},"Copy invite link"));
  var isHost=session&&session.playerId===T.hostId;
  if(session&&!isHost&&T.phase==="lobby"){
    bar.append(el("button",{class:"btn ghost small",onclick:async function(){
      if(!confirm("Leave the tournament? Your spot is removed — you can join again with a new name.")) return;
      var r=await api("/api/t/"+code+"/leave",{token:session.token});
      if(r.ok||r.status===403){ session=null; clearSession(code); }
      location.hash="";
    }},"Leave tournament"));
  } else {
    bar.append(el("button",{class:"btn ghost small",onclick:function(){
      location.hash="";
    }},"Home"));
  }
  return bar;
}

function renderLobby(app){
  app.append(topbar());
  var card=el("div",{class:"card"});
  card.append(el("h2",{},"Lobby — waiting for players"));
  card.append(el("div",{class:"bigcode"},code));
  card.append(el("div",{class:"legend"},
    "Share the code or the invite link. Players join from their own phone or laptop. ",
    T.players.length+" / "+T.maxPlayers+" joined."));

  var isHost=session&&session.playerId===T.hostId;
  var list=el("div",{class:"plist"});
  T.players.forEach(function(p){
    var pill=el("div",{class:"pill"},
      el("span",{class:"pname-inline"},p.name+(p.id===T.hostId?" 👑":"")),
      p.gamertag?el("span",{class:"gt"},"🎮 "+p.gamertag):null);
    if(isHost&&p.id!==T.hostId){
      pill.append(el("button",{class:"kick",title:"Remove "+p.name,onclick:async function(){
        if(!confirm("Remove "+p.name+" from the tournament?")) return;
        await api("/api/t/"+code+"/kick",{token:session.token,playerId:p.id});
      }},"✕"));
    }
    list.append(pill);
  });
  card.append(list);

  /* join form for visitors who haven't joined yet */
  if(!session&&(removedNotice||wasRemoved(code))){
    card.append(el("div",{class:"notice"},"You were removed from this tournament by the host. You can still watch."));
  } else if(!session){
    var jn=el("input",{class:"txt",type:"text",maxlength:"20",placeholder:"Your name","data-fkey":"joinname"});
    var jg=el("input",{class:"txt",type:"text",maxlength:"20",placeholder:"Gamertag (optional)","data-fkey":"joingt"});
    var jerr=el("div",{class:"error"});
    card.append(el("div",{class:"notice"},
      "You're watching. Join before the draw to play:",
      el("div",{class:"field"},jn),el("div",{class:"field"},jg),
      el("div",{class:"actions"},el("button",{class:"btn",onclick:async function(){
        var r=await api("/api/t/"+code+"/join",{name:jn.value,gamertag:jg.value});
        if(!r.ok){ jerr.textContent=r.data.message||"Could not join."; return; }
        session={token:r.data.token,playerId:r.data.playerId,name:jn.value.trim()};
        saveSession(code,session);
        render();
      }},"Join as player")),
      jerr));
  }

  /* host controls */
  if(isHost){
    var n=T.players.length;
    var kin=el("input",{class:"num",type:"number",min:"1",step:"1","data-fkey":"kin",
      oninput:function(){ hint.textContent=hintText(); }});
    kin.value=T.k;
    function hintText(){
      var k=parseInt(kin.value,10);
      var v=clientValidateDraw(n,k);
      return v ? "✗ "+v : "✓ "+n+" players × "+k+" games → "+(n*k/2)+" league games, top "+projectedKoSize(n)+" advance.";
    }
    var hint=el("div",{class:"legend"},hintText());
    var host=el("div",{class:"card"},
      el("h2",{},"Host controls"),
      el("div",{class:"field"},el("label",{},"Games per player"),kin),
      hint,
      el("div",{class:"actions"},el("button",{class:"btn",onclick:function(){ doDraw({k:parseInt(kin.value,10)}); }},"🎲 Draw & start")));
    if(drawError){
      var panel=el("div",{class:"notice"},drawError.message||"The draw is not possible.");
      var acts=el("div",{class:"actions"});
      if(drawError.error==="parity"){
        var kNow=drawError.k;
        if(kNow-1>=1) acts.append(el("button",{class:"btn small",onclick:function(){ kin.value=kNow-1; doDraw({k:kNow-1}); }},"Play "+(kNow-1)+" games"));
        if(kNow+1<=n-1) acts.append(el("button",{class:"btn small",onclick:function(){ kin.value=kNow+1; doDraw({k:kNow+1}); }},"Play "+(kNow+1)+" games"));
        acts.append(el("button",{class:"btn small ghost",onclick:function(){ doDraw({k:kNow,acceptExempt:true}); }},"One random player plays "+(kNow-1)));
        acts.append(el("button",{class:"btn small ghost",onclick:function(){ drawError=null; render(); }},"Wait for more players"));
      } else {
        acts.append(el("button",{class:"btn small ghost",onclick:function(){ drawError=null; render(); }},"OK"));
      }
      panel.append(acts);
      host.append(panel);
    }
    app.append(card,host);
  } else {
    card.append(el("div",{class:"legend"},"Waiting for the host to run the draw…"));
    app.append(card);
  }
}
async function doDraw(extra){
  var body={token:session.token};
  Object.keys(extra).forEach(function(k){ body[k]=extra[k]; });
  var r=await api("/api/t/"+code+"/draw",body);
  drawError=r.ok?null:r.data;
  if(!r.ok) render(); /* success re-renders via broadcast */
}

function renderTournament(app){
  app.append(topbar());
  var layout=el("div",{class:"layout"});
  var canEdit=!!session;

  /* game list */
  var fx=el("div",{class:"card"});
  fx.append(el("h2",{},"League games ",el("span",{class:"chip"},
    T.results.filter(function(r){return r.h!=null&&r.a!=null;}).length+" / "+T.fixtures.length+" played")));
  var search=el("input",{class:"txt",type:"text",placeholder:"Filter by player…","data-fkey":"filter",
    oninput:function(){ filterText=search.value; render(); }});
  search.value=filterText;
  var bar=el("div",{class:"filterbar"},search);
  if(session){
    bar.append(el("span",{class:"chip toggle"+(onlyMine?" on":""),onclick:function(){ onlyMine=!onlyMine; render(); }},"My games"));
  }
  fx.append(bar);
  var listBox=el("div",{class:"scrollbox"});
  var ft=filterText.trim().toLowerCase();
  T.fixtures.forEach(function(f,i){
    if(onlyMine&&session&&f.h!==session.playerId&&f.a!==session.playerId) return;
    if(ft){
      var hn=pl(f.h).name.toLowerCase(),an=pl(f.a).name.toLowerCase();
      if(hn.indexOf(ft)<0&&an.indexOf(ft)<0) return;
    }
    listBox.append(gameRow(i,f,canEdit));
  });
  fx.append(listBox);
  if(T.exempt!=null){
    fx.append(el("div",{class:"legend"},"° "+pl(T.exempt).name+" plays one game fewer (odd draw) — the table ranks by points per game."));
  }
  layout.append(fx);

  /* standings */
  var st=el("div",{class:"card"});
  st.append(el("h2",{},"Standings"));
  var showAvg=T.exempt!=null;
  var head=el("tr",{},el("th",{},"#"),el("th",{class:"pname"},"Player"),
    el("th",{},"P"),el("th",{},"W"),el("th",{},"D"),el("th",{},"L"),
    el("th",{},"GF"),el("th",{},"GA"),el("th",{},"GD"),el("th",{},"Pts"));
  if(showAvg) head.append(el("th",{},"Avg"));
  var tbody=el("tbody",{});
  var q=T.koSize;
  var rows=standingsOf(T);
  var qual=qualifiedIds(T,rows);
  rows.forEach(function(r,i){
    var nameCell=el("td",{class:"pname"},r.name+(T.exempt===r.id?" °":""));
    if(qual[r.id]) nameCell.append(el("span",{class:"qmark",title:"Qualified for the knockout stage"},"Q"));
    var tr=el("tr",{class:i<q?"top4":""},
      el("td",{},String(i+1)),
      nameCell,
      el("td",{},String(r.p)),el("td",{},String(r.w)),el("td",{},String(r.d)),el("td",{},String(r.l)),
      el("td",{},String(r.gf)),el("td",{},String(r.ga)),el("td",{},String(r.gd)),
      el("td",{class:"pts"},String(r.pts)));
    if(showAvg) tr.append(el("td",{},r.avg.toFixed(2)));
    tbody.append(tr);
  });
  st.append(el("div",{class:"scrollbox"},el("table",{},el("thead",{},head),tbody)));
  st.append(el("div",{class:"legend"},
    "Top "+q+" advance — ",el("span",{class:"qmark"},"Q")," marks players already guaranteed a spot. Tie-breakers: "+(showAvg?"points per game":"points")+" → goal difference → goals scored → head-to-head."));
  layout.append(st);
  app.append(layout);

  /* knockout */
  var ko=el("div",{class:"card"});
  ko.append(el("h2",{},"Knockout stage"));
  if(!leagueCompleteT(T)){
    ko.append(el("div",{class:"locked"},"🔒 Finish all league games to unlock the knockout stage."));
  } else {
    var grid=el("div",{class:"ko-grid"});
    var standing=standingsOf(T);
    var seedPos={}; standing.forEach(function(r,i){ seedPos[r.id]=i+1; });
    koRoundsOf(T).forEach(function(round,r){
      var col=el("div",{class:"ko-round"},el("h3",{},round.name));
      round.matches.forEach(function(m){
        col.append(koCard(m,r===0?seedPos:null,canEdit));
      });
      grid.append(col);
    });
    ko.append(grid);
    var champ=championOf(T);
    if(champ!=null) ko.append(el("div",{class:"champion"},"🏆 "+pl(champ).name+" is the champion! 🏆"));
  }
  if(!canEdit) ko.append(el("div",{class:"legend"},"Spectator mode — results are entered by the players."));
  app.append(ko);
}

function nameSpan(id,placeholder,away,winner){
  var cls="name"+(away?" away":"")+(winner?" winner":"");
  if(session&&id===session.playerId) cls+=" me";
  var label=id!=null?pl(id).name:(placeholder||"TBD");
  var s=el("span",{class:cls},label);
  if(id!=null&&pl(id).gamertag) s.title="🎮 "+pl(id).gamertag;
  return s;
}

function gameRow(i,f,canEdit){
  var m=T.results[i];
  var done=m.h!=null&&m.a!=null;
  var hi=scoreInput(m.h,"L"+i+"h",{disabled:!canEdit,oninput:function(){
    T.results[i].h=parseScore(hi.value); postResult(i); render();
  }});
  var ai=scoreInput(m.a,"L"+i+"a",{disabled:!canEdit,oninput:function(){
    T.results[i].a=parseScore(ai.value); postResult(i); render();
  }});
  return el("div",{class:"match"},
    el("span",{class:"gnum"},"#"+(i+1)),
    nameSpan(f.h,null,false,done&&m.h>m.a),hi,el("span",{class:"dash"},"–"),ai,
    nameSpan(f.a,null,true,done&&m.a>m.h));
}
function postResult(i){
  api("/api/t/"+code+"/result",{token:session.token,i:i,h:T.results[i].h,a:T.results[i].a});
}

function koCard(m,seedPos,canEdit){
  var ready=m.home!=null&&m.away!=null;
  var side=ready?koWinnerSide(m.scores):null;
  var hN=nameSpan(m.home,m.ph1,false,side==="h");
  var aN=nameSpan(m.away,m.ph2,true,side==="a");
  if(seedPos&&m.home!=null) hN.prepend(el("span",{class:"seed"},String(seedPos[m.home])));
  if(seedPos&&m.away!=null) aN.append(el("span",{class:"seed"},String(seedPos[m.away])));
  var hi=scoreInput(m.scores.h,"K"+m.key+"h",{disabled:!ready||!canEdit,oninput:function(){
    setKo(m.key,"h",parseScore(hi.value));
  }});
  var ai=scoreInput(m.scores.a,"K"+m.key+"a",{disabled:!ready||!canEdit,oninput:function(){
    setKo(m.key,"a",parseScore(ai.value));
  }});
  var card=el("div",{class:"ko-match"},
    el("div",{class:"tag"},m.tag),
    el("div",{class:"match"},hN,hi,el("span",{class:"dash"},"–"),ai,aN));
  if(ready&&m.scores.h!=null&&m.scores.a!=null&&m.scores.h===m.scores.a){
    var pi=scoreInput(m.scores.ph,"K"+m.key+"ph",{disabled:!canEdit,oninput:function(){ setKo(m.key,"ph",parseScore(pi.value)); }});
    var pa=scoreInput(m.scores.pa,"K"+m.key+"pa",{disabled:!canEdit,oninput:function(){ setKo(m.key,"pa",parseScore(pa.value)); }});
    card.append(el("div",{class:"pens"},"Penalties:",pi,el("span",{class:"dash"},"–"),pa));
  }
  return card;
}
function setKo(key,field,val){
  var cur=T.ko[key]||{h:null,a:null,ph:null,pa:null};
  cur[field]=val;
  T.ko[key]=cur;
  api("/api/t/"+code+"/ko",{token:session.token,key:key,h:cur.h,a:cur.a,ph:cur.ph,pa:cur.pa});
  render();
}

/* koSize is stored after the draw; project it from the player count before */
function koSizeDisplay(t){
  return t.koSize!=null?t.koSize:projectedKoSize(t.players.length);
}

/* ================= boot & routing ================= */

function currentCode(){
  var m=/^#\/t\/([A-Za-z0-9]{6})$/.exec(location.hash||"");
  if(m) return m[1].toUpperCase();
  var q=new URLSearchParams(location.search).get("c");
  if(q&&/^[A-Za-z0-9]{6}$/.test(q)) return q.toUpperCase();
  return null;
}
async function boot(){
  var c=currentCode();
  if(!c){
    code=null;T=null;session=null;
    if(ws){ try{ ws.onclose=null; ws.close(); }catch(e){} ws=null; }
    clearTimeout(wsTimer);
    render();
    return;
  }
  code=c;
  session=loadSession(code);
  removedNotice=false;
  var res;
  try{ res=await fetch("/api/t/"+code+"/state"); }catch(e){ res=null; }
  if(!res||res.status===404){
    var app=$("#app"); app.innerHTML="";
    app.append(el("div",{class:"card"},
      el("h2",{},"Not found"),
      el("div",{class:"legend"},"No tournament with code "+code+". Check the code with your host."),
      el("div",{class:"actions"},el("button",{class:"btn",onclick:function(){ location.hash=""; }},"Back"))));
    return;
  }
  setT((await res.json()).t);
  connect();
  render();
}
if(typeof document!=="undefined"){
  window.addEventListener("hashchange",boot);
  document.addEventListener("DOMContentLoaded",boot);
}
</script>
</body>
</html>
